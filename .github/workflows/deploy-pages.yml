name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read contract address from deployment.json
        id: addr
        run: |
          ADDR=$(node -e "console.log(JSON.parse(require('fs').readFileSync('deployment.json','utf8')).contractAddress)")
          echo "address=$ADDR" >> "$GITHUB_OUTPUT"
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_CONTRACT_ADDRESS: ${{ steps.addr.outputs.address }}
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
